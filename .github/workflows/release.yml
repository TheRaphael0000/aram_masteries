name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build & Release Windows Binary
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Disable Windows Defender on build directories
        shell: powershell
        run: |
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo", "$env:GITHUB_WORKSPACE"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Release Tag
        run: |
          TAG=$(git describe --tags --always --exclude "*-g*")
          echo "Determined release tag: $TAG"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/release/
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      - name: Run Tests (Release mode)
        run: cargo test --release

      - name: Build Windows Binary
        run: cargo build --release --locked

      - name: Package Windows Artifacts
        run: |
          EXE_PATH="target/release/aram_masteries.exe"
          ZIP_NAME="aram_masteries-${RELEASE_TAG}-windows-x86_64.zip"

          cp "$EXE_PATH" ./
          7z a "$ZIP_NAME" aram_masteries.exe README.md
          echo "ARCHIVE_NAME=$ZIP_NAME" >> "$GITHUB_ENV"
          echo "EXE_PATH=$EXE_PATH" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists. Uploading artifacts..."
            gh release upload "$RELEASE_TAG" "$EXE_PATH" "$ARCHIVE_NAME" --clobber
          else
            echo "Creating release $RELEASE_TAG..."
            gh release create "$RELEASE_TAG" "$EXE_PATH" "$ARCHIVE_NAME" \
              --title "Release $RELEASE_TAG" \
              --target "${{ github.sha }}" \
              --generate-notes
          fi
